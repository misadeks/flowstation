[package]
name = "wap-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FlowStation standalone WAP 1.x gateway (replaces Kannel)."

[[bin]]
name = "flowstation-wap-gateway"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "test-util"] }

[lints]
workspace = true
